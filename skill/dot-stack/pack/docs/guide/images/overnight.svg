<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" width="640" height="1080" role="img" aria-labelledby="title desc">
<title id="title">A bounded run can resume</title>
<desc id="desc">Check the finish condition, make one authorized change, verify it, and log the decision. Repeat only inside the original scope. Finish with evidence or stop with a resumable handoff. Durability requires a verified host capability.</desc>
<rect width="640" height="1080" rx="24" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#087f8c"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<text x="36" y="55" font-size="31" font-weight="700" fill="#172b4d">A bounded run can resume</text>
<rect x="36" y="87" width="568" height="120" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="36" y="103" width="6" height="88" rx="3" fill="#087f8c"/>
<text x="60" y="125" font-size="26" font-weight="700" fill="#172b4d">Before stepping away</text>
<text x="60" y="159" font-size="24" font-weight="400" fill="#44566c">Goal + finish condition + allowed scope</text>
<text x="60" y="189" font-size="24" font-weight="400" fill="#44566c">Owned workspace + explicit stop rules</text>
<path d="M320 213 V242" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="254" width="568" height="188" rx="16" fill="#e9f7f7" stroke="#cbd5e1" stroke-width="2"/>
<rect x="36" y="270" width="6" height="156" rx="3" fill="#087f8c"/>
<text x="60" y="292" font-size="26" font-weight="700" fill="#172b4d">While the session can work</text>
<text x="60" y="326" font-size="24" font-weight="400" fill="#44566c">1. Check the original finish condition</text>
<text x="60" y="356" font-size="24" font-weight="400" fill="#44566c">2. Make one authorized change</text>
<text x="60" y="386" font-size="24" font-weight="400" fill="#44566c">3. Run the check on that candidate</text>
<text x="60" y="416" font-size="24" font-weight="400" fill="#44566c">4. Log the decision and result</text>
<path d="M320 448 V477" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="489" width="568" height="153" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="36" y="505" width="6" height="121" rx="3" fill="#087f8c"/>
<text x="60" y="527" font-size="26" font-weight="700" fill="#172b4d">Choose the next state</text>
<text x="60" y="561" font-size="24" font-weight="400" fill="#44566c">DONE → report the passing evidence</text>
<text x="60" y="591" font-size="24" font-weight="400" fill="#44566c">PROGRESS → repeat inside the scope</text>
<text x="60" y="621" font-size="24" font-weight="400" fill="#44566c">BLOCKED → name the required next step</text>
<path d="M320 648 V677" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="689" width="568" height="153" rx="16" fill="#e9f7f7" stroke="#cbd5e1" stroke-width="2"/>
<rect x="36" y="705" width="6" height="121" rx="3" fill="#087f8c"/>
<text x="60" y="727" font-size="26" font-weight="700" fill="#172b4d">Before the session ends</text>
<text x="60" y="761" font-size="24" font-weight="400" fill="#44566c">Record branch, edits, and owned processes</text>
<text x="60" y="791" font-size="24" font-weight="400" fill="#44566c">List failed and unverified checks</text>
<text x="60" y="821" font-size="24" font-weight="400" fill="#44566c">Leave one exact resume point</text>
<text x="40" y="902" font-size="22" font-weight="400" fill="#44566c">Active session ≠ durable future wake</text>
<text x="40" y="933" font-size="22" font-weight="400" fill="#44566c">Running process ≠ assistant continuation</text>
<text x="40" y="964" font-size="22" font-weight="400" fill="#44566c">Promise a wake only after host confirmation.</text>
</g>
</svg>
