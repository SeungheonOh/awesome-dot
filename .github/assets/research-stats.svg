<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="278" viewBox="0 0 1280 278" role="img" aria-labelledby="title desc">
<title id="title">What independent AI studies measured</title>
<desc id="desc">Noy and Zhang (Science, 2023): 40% less task time and 18% higher quality scores in a writing experiment with 453 professionals assigned ChatGPT or a control condition. Brynjolfsson, Li, and Raymond (QJE, 2025): 15% more issues resolved per hour in a study tracking an AI-assistant rollout across 5,172 customer-support agents. These are not benchmarks of dot or this repository.</desc>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="278" rx="14" fill="#EFECE3"/>
<path d="M427 28V220M853 28V220" stroke="#C7C8BD"/>
<rect x="0" y="237" width="1280" height="41" rx="0" fill="#17221D"/>
<text x="32" y="49" font-size="16" fill="#536347" font-weight="700" letter-spacing="1.4">WRITING / TIME</text><text x="28" y="142" font-size="87" fill="#17221D" font-weight="700" letter-spacing="-4">40%</text><text x="32" y="181" font-size="23" fill="#17221D" font-weight="700" >less task time</text><text x="32" y="213" font-size="16" fill="#526051" font-weight="400" >453 professionals · ChatGPT · 2023</text><text x="459" y="49" font-size="16" fill="#536347" font-weight="700" letter-spacing="1.4">WRITING / QUALITY</text><text x="455" y="142" font-size="87" fill="#17221D" font-weight="700" letter-spacing="-4">18%</text><text x="459" y="181" font-size="23" fill="#17221D" font-weight="700" >higher quality scores</text><text x="459" y="213" font-size="16" fill="#526051" font-weight="400" >Same writing experiment</text><text x="885" y="49" font-size="16" fill="#536347" font-weight="700" letter-spacing="1.4">CUSTOMER SUPPORT</text><text x="881" y="142" font-size="87" fill="#17221D" font-weight="700" letter-spacing="-4">15%</text><text x="885" y="181" font-size="23" fill="#17221D" font-weight="700" >more issues resolved / hour</text><text x="885" y="213" font-size="16" fill="#526051" font-weight="400" >5,172 support agents · AI assistant · 2025</text><text x="32" y="264" font-size="15" fill="#F4F2E9" font-weight="700" letter-spacing="0.65">INDEPENDENT STUDIES OF OTHER AI TOOLS. NOT BENCHMARKS OF DOT OR THIS REPOSITORY.</text></g>
</svg>
