<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="786" viewBox="0 0 1280 786" role="img" aria-labelledby="title desc">
<title id="title">The score ties. Inspect the files.</title>
<desc id="desc">16 actual native-agent runs on 8 paired fictional tasks, 6 October 2026. Saved-file excerpts, not screenshots. C: no designated package. S: designated package supplied. Both F6 result.csv files are identical; selected columns are channel, gross_minor, refund_minor, and net_minor, with shortened display headings. Phone gross and net are NULL. A separate post-hoc F8 diagnostic with U+D800 followed by LF saved and reloaded text in C, but S failed to save with UnicodeEncodeError. Selected JSON fields are transcribed from execution-results.json. Both arms passed 40/40 primary artifact-criterion groups and 8/8 artifacts. 0 percentage-point pass-rate difference, no measured uplift. Post-hoc findings do not change primary scores. Shared runtime; C was not skill-free. Process integrity unverified.</desc>
