<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1178" viewBox="0 0 400 1178" role="img" aria-labelledby="title desc">
<title id="title">The score ties. Inspect the files.</title>
<desc id="desc">16 actual native-agent runs on 8 paired fictional tasks, 6 October 2026. Saved-file excerpts, not screenshots. C: no designated package. S: designated package supplied. Both F6 result.csv files are identical; selected columns are channel, gross_minor, refund_minor, and net_minor, with shortened display headings. Phone gross and net are NULL. A separate post-hoc F8 diagnostic with U+D800 followed by LF saved and reloaded text in C, but S failed to save with UnicodeEncodeError. Selected JSON fields are transcribed from execution-results.json. Both arms passed 40/40 primary artifact-criterion groups and 8/8 artifacts. 0 percentage-point pass-rate difference, no measured uplift. Post-hoc findings do not change primary scores. Shared runtime; C was not skill-free. Process integrity unverified.</desc>
<metadata>{&quot;excerpts&quot;: [{&quot;columns&quot;: [&quot;channel&quot;, &quot;gross_minor&quot;, &quot;refund_minor&quot;, &quot;net_minor&quot;], &quot;display&quot;: &quot;CSV values reformatted as a table; integer minor units&quot;, &quot;display_headings&quot;: [&quot;CHANNEL&quot;, &quot;GROSS&quot;, &quot;REFUNDS&quot;, &quot;NET&quot;], &quot;paths&quot;: [&quot;evaluation/results/native-cloud-2026-10-06/artifacts/N09-F6-C/result.csv&quot;, &quot;evaluation/results/native-cloud-2026-10-06/artifacts/N10-F6-S/result.csv&quot;], &quot;rows&quot;: &quot;all four data rows&quot;}, {&quot;display&quot;: &quot;selected saved JSON fields; error message suffix quoted&quot;, &quot;error_excerpt&quot;: &quot;surrogates not allowed&quot;, &quot;fields&quot;: [&quot;input&quot;, &quot;saved&quot;, &quot;text_equal_after_reload&quot;, &quot;error_type&quot;], &quot;path&quot;: &quot;evaluation/results/native-cloud-2026-10-06/f8/execution-results.json&quot;, &quot;selector&quot;: &quot;rows[*].runs.posthoc_surrogate.result&quot;}], &quot;renderer&quot;: &quot;evaluation/visualization/render_native_results.py&quot;, &quot;source_sha256&quot;: {&quot;evaluation/results/native-cloud-2026-10-06/artifacts/N09-F6-C/result.csv&quot;: &quot;1604d5474b2c70b363d4652d59d9c5469def0c9beb2a0555a0d89542f04cc5d3&quot;, &quot;evaluation/results/native-cloud-2026-10-06/artifacts/N10-F6-S/result.csv&quot;: &quot;1604d5474b2c70b363d4652d59d9c5469def0c9beb2a0555a0d89542f04cc5d3&quot;, &quot;evaluation/results/native-cloud-2026-10-06/f8/execution-results.json&quot;: &quot;b748b863a51544906e1400a7f28d50ede35fc47eb520c5acf843e89e5544bbad&quot;, &quot;evaluation/results/native-cloud-2026-10-06/paired-summary.json&quot;: &quot;2a8d6c2279cdc53dec769fd2085e2b72e7f07e5319e8f063c61e86156150de11&quot;, &quot;evaluation/results/status.json&quot;: &quot;176724896a111c36a37550eed656f68d93628942d3b7e567d18326e6268108fd&quot;}}</metadata>
