<title id="title">Native-cloud study: no measured primary-criterion uplift</title>
<desc id="desc">16 actual native-agent first submissions on 8 paired fictional cases. C received no designated package; S received the designated package. Both passed 40/40 primary artifact-criterion groups and 8/8 artifacts. 0 percentage-point pass-rate difference. Ceiling tie; no demonstrated uplift. Shared ambient runtime; C was not skill-free. Process integrity unverified. A separate post-hoc F8 Unicode save/reload check passed in C and failed with UnicodeEncodeError in S; it does not alter primary scores. No productivity claim.</desc>
