<svg xmlns="http://www.w3.org/2000/svg" width="640" height="712" viewBox="0 0 640 712" role="img" aria-labelledby="title desc">
<title id="title">What independent AI studies measured</title>
<desc id="desc">Noy and Zhang (Science, 2023): 40% less task time and 18% higher quality scores in a writing experiment with 453 professionals assigned ChatGPT or a control condition. Brynjolfsson, Li, and Raymond (QJE, 2025): 15% more issues resolved per hour in a study tracking an AI-assistant rollout across 5,172 customer-support agents. These are not benchmarks of dot or this repository.</desc>
<g font-family="Arial, Helvetica, sans-serif"><rect width="640" height="712" rx="14" fill="#EFECE3"/>
<path d="M32 211H608M32 411H608" stroke="#C7C8BD"/>
<path d="M0 627H640V698Q640 712 626 712H14Q0 712 0 698Z" fill="#17221D"/><text x="32" y="40" font-size="18" fill="#536347" font-weight="700" letter-spacing="1.5">WRITING / TIME</text><text x="26" y="128" font-size="91" fill="#17221D" font-weight="700" letter-spacing="-4">40%</text><text x="255" y="98" font-size="22" fill="#17221D" font-weight="700" >less task time</text><text x="32" y="177" font-size="21" fill="#526051" font-weight="400" >453 professionals · ChatGPT · 2023</text><text x="32" y="240" font-size="18" fill="#536347" font-weight="700" letter-spacing="1.5">WRITING / QUALITY</text><text x="26" y="328" font-size="91" fill="#17221D" font-weight="700" letter-spacing="-4">18%</text><text x="255" y="298" font-size="22" fill="#17221D" font-weight="700" >higher quality scores</text><text x="32" y="377" font-size="21" fill="#526051" font-weight="400" >Same writing experiment</text><text x="32" y="440" font-size="18" fill="#536347" font-weight="700" letter-spacing="1.5">CUSTOMER SUPPORT</text><text x="26" y="528" font-size="91" fill="#17221D" font-weight="700" letter-spacing="-4">15%</text><text x="255" y="498" font-size="22" fill="#17221D" font-weight="700" >more issues resolved / hour</text><text x="32" y="577" font-size="21" fill="#526051" font-weight="400" >5,172 support agents · AI assistant · 2025</text><text x="32" y="662" font-size="19" fill="#F4F2E9" font-weight="700" >INDEPENDENT STUDIES OF OTHER AI TOOLS.</text><text x="32" y="693" font-size="19" fill="#F4F2E9" font-weight="700" >NOT DOT OR REPOSITORY BENCHMARKS.</text></g>
