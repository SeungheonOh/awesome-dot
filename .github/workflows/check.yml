name: Check recipe collection

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and generated files
        run: python3 scripts/check.py
      - name: Test the validator and renderer
        run: python3 -m unittest discover -s tests -v
